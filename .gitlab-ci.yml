image: docker:24.0.7

services:
  - docker:dind

variables:
  DEPLOY_SERVER_IP: "13.212.48.23"
  AWS_REGION: "ap-southeast-1"
  AWS_DEFAULT_REGION: "ap-southeast-1"
  AWS_ACCOUNT_ID: "1733-4236-1670"
  ECR_REPOSITORY: "nemi-product-manager"
  AWS_ACCESS_KEY_ID: "AKIASQXACRBDHVWHPBGJ"
  AWS_SECRET_ACCESS_KEY: "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"
  MAVEN_OPTS: "-Djava.awt.headless=true -Dmaven.repo.local=./.m2/repository"
  ECR_REGISTRY: "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
  ECR_REPOSITORY_URI: "${ECR_REGISTRY}/${ECR_REPOSITORY}"
  ENV_NAME: "feature/webhook-manager-service"
  ARGOCD_BRANCH: "release/dev"
stages:
  - build
  - dockerize
  - argocd
  

build:
  stage: build
  image: maven:3.9.6-eclipse-temurin-17
  cache:
    key: maven-cache
    paths:
      - .m2/repository
  before_script:
    - mkdir -p ~/.m2
    - |
      cat > ~/.m2/settings.xml <<'EOF'
      <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
           xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
           xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                               https://maven.apache.org/xsd/settings-1.0.0.xsd">

        <mirrors>
          <mirror>
            <id>maven-central</id>
            <url>https://repo.maven.apache.org/maven2</url>
            <mirrorOf>central</mirrorOf>
          </mirror>
        </mirrors>

        <servers>
          <server>
            <id>gitlab-group-maven</id>
            <username>oauth2</username>
            <password>glpat-TkdafIsGT3Ulu8awUAmv7G86MQp1OmczcWEzCw.01.1201zxu4t</password>
          </server>
        </servers>
      </settings>
      EOF
  script:
    - mvn clean package -DskipTests
    - export PROJECT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
    - echo $PROJECT_VERSION > version.txt
    - export PROJECT_NAME=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
    - echo "Project name is $PROJECT_NAME"
    - echo $PROJECT_NAME > project-name.txt
    - export COMMIT_HASH_SHORT="${CI_COMMIT_SHA:0:7}"
    - echo $COMMIT_HASH_SHORT > commit-hash.txt
    - echo "Commit hash is $COMMIT_HASH_SHORT"
    - mkdir -p build-artifacts
    - cp target/${PROJECT_NAME}-${PROJECT_VERSION}.jar build-artifacts/${PROJECT_NAME}.jar

  artifacts:
    paths:
      - build-artifacts/
      - version.txt
      - project-name.txt
      - docker-compose.yml
      - commit-hash.txt
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH == "feature/webhook-manager-service"'

dockerize:
  stage: dockerize
  image: docker:24.0.7
  services:
    - docker:dind
  dependencies:
    - build
  before_script:
    - apk add --no-cache python3 py3-pip git
    - pip3 install --break-system-packages awscli
    - aws --version
    - docker version
    - aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
    - aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
    - aws configure set default.region $AWS_REGION
    - export PROJECT_VERSION=$(cat version.txt)
    - export PROJECT_NAME=$(cat project-name.txt)
    - export COMMIT_HASH_SHORT=$(cat commit-hash.txt)
    - export IMAGE_TAG="${PROJECT_NAME}-${ENV_NAME}-${PROJECT_VERSION}-${COMMIT_HASH_SHORT}"
    - echo "Debug AWS variables:"
    - echo "AWS_REGION=$AWS_REGION"
    - echo "AWS_ACCOUNT_ID=$AWS_ACCOUNT_ID" 
    - echo "ECR_REGISTRY=$ECR_REGISTRY"
    - echo "ECR_REPOSITORY=$ECR_REPOSITORY"
    - echo "ECR_REPOSITORY_URI=$ECR_REPOSITORY_URI"
    - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
    - echo "ECR login successful"
    - ls
  script:
    - docker build -t ${ECR_REPOSITORY_URI}:${IMAGE_TAG} .
    - docker push ${ECR_REPOSITORY_URI}:${IMAGE_TAG}
  rules:
    - if: '$CI_COMMIT_BRANCH == "feature/webhook-manager-service"'

argocd:
  stage: argocd
  image: alpine:latest
  dependencies:
    - build  # Để lấy các artifacts
  before_script:
    - apk add --no-cache git curl jq yq
    - export PROJECT_VERSION=$(cat version.txt)
    - export PROJECT_NAME=$(cat project-name.txt)
    - export COMMIT_HASH_SHORT=$(cat commit-hash.txt)
    - export IMAGE_TAG="${PROJECT_NAME}-${ENV_NAME}-${PROJECT_VERSION}-${COMMIT_HASH_SHORT}"
    - git config --global user.email "gitlab-ci@example.com"
    - git config --global user.name "GitLab CI"
  script:
    - git clone https://argocd:${ARGOCD_TOKEN}@gitlab.com/dube2/srs-nemi-tool-argocd.git
    - cd srs-nemi-tool-argocd
    - ls
    - git checkout $ARGOCD_BRANCH
    - yq eval ".image.tag = \"$IMAGE_TAG\"" -i charts/${PROJECT_NAME}/values.yaml
    - echo "=== Updated values.yaml ==="
    - cat charts/${PROJECT_NAME}/values.yaml
    - git add charts/${PROJECT_NAME}/values.yaml
    - git commit -m "Update image tag to $IMAGE_TAG"
    - git push origin $ARGOCD_BRANCH
  rules:
    - if: '$CI_COMMIT_BRANCH == "feature/webhook-manager-service"'

