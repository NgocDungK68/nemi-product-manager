logging:
  level:
    root: info
    com:
      nemi: debug
    org.apache: off
  file:
    name: /tmp/log/nemi.log
  logback:
    rollingpolicy:
      file-name-pattern: /tmp/log/nemi.%d{yyyy-MM-dd}.%i.log
      max-history: 30
      max-file-size: 10MB
      total-size-cap: 1GB
      clean-history-on-start: false






