      - products/create
      - products/update
      - products/delete

  order:
    status:
      mapping:
        open: "processing"     # Tất cả các order đang hoạt động
        closed: "delivered"    # Các order đã lưu trữ
        cancelled: "cancelled" # Các order bị hủy
  sync:
    order: 100
    order-item: 200
    product: 100
    page-start: 1
