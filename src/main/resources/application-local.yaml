spring:
  application:
    name: nemi-product-manager
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:postgresql://nemi-uat.cbwe2q8wsga5.ap-southeast-1.rds.amazonaws.com:5432/dev_nemi
    username: dev_nemi_product_manager
    password: Nemi123#
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 120000
      validation-timeout: 5000
  jpa:
